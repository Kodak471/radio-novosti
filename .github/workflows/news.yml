
name: Получение и перевод новостей

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,17 * * *'

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить библиотеки
        run: pip install deep-translator edge-tts feedparser

      - name: Получить новости
        run: python news.py

      - name: Перевести новости
        run: python prepare_news.py

      - name: Создать MP3
        run: python make_audio.py

      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: radio-novosti-mp3
          path: |
            radio_novosti.mp3
            script.txt
            selected_news.json
          if-no-files-found: error
